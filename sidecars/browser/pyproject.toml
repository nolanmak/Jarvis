[project]
name = "augmentagent-browser-sidecar"
version = "0.1.0"
description = "Playwright + browser-use sidecar for the AugmentAgent Rust daemon."
requires-python = ">=3.11"
dependencies = [
    "playwright==1.49.1",
    "browser-use==0.12.6",
]

[project.scripts]
augmentagent-browser-sidecar = "sidecar:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["sidecar"]
