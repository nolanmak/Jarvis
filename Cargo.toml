[workspace]
resolver = "2"
members = [
    "crates/augmentagent-store",
    "crates/augmentagent-channel-core",
    "crates/augmentagent-channel-email",
    "crates/augmentagent-channel-linkedin",
    "crates/augmentagent-channel-instagram",
    "crates/augmentagent-channel-twitter",
    "crates/augmentagent-channel-discord-dm",
    "crates/augmentagent-channel-slack",
    "crates/augmentagent-channel-telegram-bot",
    "crates/augmentagent-channel-whatsapp",
    "crates/augmentagent-channel-calendar",
    "crates/augmentagent-channel-voice",
    "crates/augmentagent-channel-github",
    "crates/augmentagent-channel-linear",
    "crates/augmentagent-channel-notion",
    "crates/augmentagent-channel-calendly",
    "crates/augmentagent-channel-reddit",
    "crates/augmentagent-channel-meetup",
    "crates/augmentagent-channel-gdrive",
    "crates/augmentagent-channel-contacts",
    "crates/augmentagent-channel-deft",
    "crates/augmentagent-content-adapter",
    "crates/augmentagent-proactive",
    "crates/augmentagent-browser-client",
    "crates/augmentagent-renderer-client",
    "crates/augmentagent-approval-discord",
    "crates/augmentagent-auth",
    "crates/augmentagent-wiki",
    "crates/augmentagent-cli",
    "crates/augmentagent-loops",
    "crates/augmentagent-tools",
    "crates/augmentagent-mcp-memory",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
license = "ISC"
repository = "https://github.com/nolanmak/MyAgentAssistant"

[workspace.dependencies]
# Dangercat (jupitersoftco/dangercat) is a private repo and cannot be consumed
# as a public cargo git dep. `ClaudeCliReasoner` re-implements the
# ~60 lines of claudekernel we actually need (stream-json child process spawn);
# the `Reasoner` trait boundary in augmentagent-channel-email leaves the door
# open for a dangercat-backed impl if/when the user grants cargo git access.

# Runtime
tokio = { version = "1.41", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
futures = "0.3"

# Errors / logging / config
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

# Data
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Concurrency
dashmap = "6"

# Discord (Phase 2)
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "rustls_backend", "model", "http", "cache"] }

# Misc
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }

# #231 — cron-style /loop scheduling. `cron` parses 5-field cron exprs
# and computes next firings; `chrono-tz` carries the IANA tz database
# so cron expressions can be anchored to a user-specific zone (DST-aware).
cron = "0.12"
chrono-tz = "0.10"

# Test-only HTTP mock (#77 normShares body snapshot tests)
wiremock = "0.6"
