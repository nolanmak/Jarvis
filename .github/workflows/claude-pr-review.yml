name: Claude PR Review (Phase 1)

# Independent review is performed by the autoship controller. PR validation
# never receives a model credential or a write-capable token. A privileged
# review must run separately against trusted code with protected credentials.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  no_op_notice:
    name: No-op (no secret configured)
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice::Independent review is owned by the autoship controller; PR jobs receive no model secrets."
