name: iMessage exporter
on:
  pull_request:
    paths:
      - 'scripts/imessage/**'
      - '.github/workflows/imessage.yml'
      - "scripts/ci-contract.py"
      - "scripts/ci-contract.json"
      - "scripts/ci-contract-sync.py"
      - "scripts/tests/ci_contract_test.py"
permissions:
  contents: read
jobs:
  exporter:
    # Python 3.9 compatibility coverage requires an available runner build.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.9'
      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id imessage/exporter/2"
