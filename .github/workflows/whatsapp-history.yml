name: WhatsApp history
on:
  pull_request:
    paths:
      - 'scripts/whatsapp/**'
      - 'crates/augmentagent-channel-whatsapp-history/**'
      - 'crates/augmentagent-channel-imessage/**'
      - 'crates/augmentagent-mcp-memory/**'
      - 'crates/augmentagent-cli/**'
      - 'crates/augmentagent-channel-core/**'
      - 'Cargo.*'
      - '.github/workflows/whatsapp-history.yml'
      - "scripts/ci-contract.py"
      - "scripts/ci-contract.json"
      - "scripts/ci-contract-sync.py"
      - "scripts/tests/ci_contract_test.py"
permissions:
  contents: read
# Superseded PR heads cancel; non-PR runs retain distinct queue slots.
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
  history:
    # Python 3.9 compatibility coverage requires an available runner build.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.9'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.94.1
      # Restore-only: rust-cache.yml writes this cache from main. Build
      # parallelism doesn't change artifacts, so it stays out of the cache key.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ci
          env-vars: ImageOS
          save-if: false
        env:
          CARGO_BUILD_JOBS: ''
      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id whatsapp-history/history/4"

      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id whatsapp-history/history/5"

      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id whatsapp-history/history/6"

      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id whatsapp-history/history/7"
