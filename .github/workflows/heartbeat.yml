name: Heartbeat
on:
  pull_request:
    paths:
      - 'crates/augmentagent-heartbeat/**'
      - 'crates/augmentagent-cli/src/heartbeat_cmd.rs'
      - 'crates/augmentagent-cli/src/main.rs'
      - 'crates/augmentagent-cli/tests/heartbeat_cli.rs'
      - 'crates/augmentagent-store/**'
      - 'crates/augmentagent-channel-core/src/reasoner.rs'
      - 'docs/reasoner-capabilities.json'
      - '.github/workflows/heartbeat.yml'
      - 'Cargo.*'
      - "scripts/ci-contract.py"
      - "scripts/ci-contract.json"
      - "scripts/ci-contract-sync.py"
      - "scripts/tests/ci_contract_test.py"
permissions:
  contents: read
# Superseded PR heads cancel; non-PR runs retain distinct queue slots.
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Format heartbeat crate
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id heartbeat/heartbeat/3"

      - name: Heartbeat lint
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id heartbeat/heartbeat/4"

      - name: Heartbeat behavior
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id heartbeat/heartbeat/5"

      - name: Store schema and capability manifest
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id heartbeat/heartbeat/6"
      - name: CLI unit and process tests
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id heartbeat/heartbeat/7"
