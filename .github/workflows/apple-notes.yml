name: Apple Notes
on:
  pull_request:
    paths:
      - 'scripts/apple-notes/**'
      - 'crates/augmentagent-channel-apple-notes/**'
      - 'crates/augmentagent-mcp-memory/**'
      - 'crates/augmentagent-cli/**'
      - 'crates/augmentagent-channel-core/**'
      - 'Cargo.*'
      - '.github/workflows/apple-notes.yml'
      - "scripts/ci-contract.py"
      - "scripts/ci-contract.json"
      - "scripts/ci-contract-sync.py"
      - "scripts/tests/ci_contract_test.py"
permissions:
  contents: read
jobs:
  exporter:
    # Python 3.9 compatibility coverage requires an available runner build.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.9'
      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id apple-notes/exporter/2"

  notes:
    # Python 3.9 compatibility coverage requires an available runner build.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.9'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id apple-notes/notes/4"

      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id apple-notes/notes/5"

      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id apple-notes/notes/6"
