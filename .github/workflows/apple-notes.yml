name: Apple Notes
on:
  pull_request:
    paths:
      - 'scripts/apple-notes/**'
      - 'crates/augmentagent-channel-apple-notes/**'
      - 'crates/augmentagent-mcp-memory/**'
      - 'crates/augmentagent-cli/**'
      - 'crates/augmentagent-channel-core/**'
      - 'Cargo.*'
      - '.github/workflows/apple-notes.yml'
      - "scripts/ci-contract.py"
      - "scripts/ci-contract.json"
      - "scripts/ci-contract-sync.py"
      - "scripts/tests/ci_contract_test.py"
permissions:
  contents: read
# Superseded PR heads cancel; non-PR runs retain distinct queue slots.
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
  exporter:
    # Python 3.9 compatibility coverage requires an available runner build.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.9'
      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id apple-notes/exporter/2"
