name: macOS suites

# The macOS legs of `channels` (rust.yml, with its `phone` job) and
# `platform` (platform.yml). They queue for the account's small hosted macOS
# concurrency cap, so they run on every push to main, nightly, on demand
# (`gh workflow run macos.yml --ref <branch>`), and on pull requests only
# when macOS-sensitive paths change. Every PR still gets the macOS compile
# gate (`check (macos-latest)` in rust.yml).
#
# Each job here mirrors its Linux job(s) step for step, minus steps marked
# `if: runner.os == 'Linux'`; scripts/tests/ci_contract_test.py fails if they
# drift. Edit the Linux job and this file together.

on:
  pull_request:
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '**/Cargo.toml'
      - 'rust-toolchain*'
      - '.cargo/**'
      - 'scripts/lib/**'
      # Shell runs under BSD tools on macOS (updater, installers, suites).
      - 'scripts/*.sh'
      - 'scripts/tests/*.sh'
      - 'scripts/install-*'
      - 'scripts/uninstall-*'
      - 'scripts/tests/launchd_installers_test.py'
      - 'scripts/macos_parity_inventory.py'
      - 'docs/macos-parity-inventory.json'
      # Keychain credential backend.
      - 'crates/augmentagent-auth/**'
      # Sidecars these legs build and test natively on macOS.
      - 'sidecars/wa-sidecar/**'
      - 'sidecars/fetch/**'
      - 'sidecars/renderer/**'
      - '.github/workflows/macos.yml'
      - "scripts/ci-contract.py"
      - "scripts/ci-contract.json"
      - "scripts/ci-contract-sync.py"
      - "scripts/tests/ci_contract_test.py"
      - "scripts/ci-pinned-tools.py"
      - "scripts/tests/ci_pinned_tools_test.py"
  push:
    branches: [main]
  schedule:
    # Catch runner image drift on days without merges. After the
    # rust-cache.yml warm (07:23 UTC) so a new image restores a fresh cache.
    - cron: '53 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR heads cancel; non-PR runs retain distinct queue slots.
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
  channels-macos:
    # Mirrors rust.yml `channels` then `phone`.
    name: channels (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      # Restore-only: rust-cache.yml writes this cache from main. Build
      # parallelism doesn't change artifacts, so it stays out of the cache key.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ci
          env-vars: ImageOS
          save-if: false
        env:
          CARGO_BUILD_JOBS: ''

      # LinkedIn archive/read/approval suite plus the directly affected
      # store/auth contracts. No live credentials.
      - name: LinkedIn archive, recall, and approval contracts
        shell: bash
        env:
          AUGMENTAGENT_GH_DISABLE: '1'
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/channels-macos/3"

      # WhatsApp sidecar wire contract: Go sidecar plus the Rust channel
      # against the real Go process.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: sidecars/wa-sidecar/go.sum
      - name: WhatsApp sidecar Go tests, race checks and vet
        working-directory: sidecars/wa-sidecar
        env:
          GOMAXPROCS: 2
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/channels-macos/5"
      - name: Build exact sidecar used by Rust contract tests
        working-directory: sidecars/wa-sidecar
        env:
          GOMAXPROCS: 2
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/channels-macos/6"
      - name: WhatsApp Rust channel and real Go-process contract tests
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/channels-macos/7"
      - name: WhatsApp Rust channel lint
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/channels-macos/8"

      # Phone offline acceptance.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check that the runner rejects missing or skipped coverage
        env: &phone_env
          AUGMENTAGENT_GH_DISABLE: '1'
          AUGMENTAGENT_PHONE_ENABLED: '0'
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/channels-macos/10"
      - name: Live receipt validator (synthetic fixtures only)
        env: *phone_env
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/channels-macos/11"
      - name: Portable bridge search and parent lifetime
        env: *phone_env
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/channels-macos/12"
      - name: Journal write guard including portable path resolution
        env: *phone_env
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/channels-macos/13"
      - name: Compile opt-in native phone probes (no model calls)
        env: *phone_env
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/channels-macos/14"
      - name: Required offline phone suites
        env: *phone_env
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/channels-macos/15"
      - name: Service installation preserves private phone configuration
        env: *phone_env
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/channels-macos/16"
      - name: Pre-phone database upgrade and rollback compatibility
        env: *phone_env
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/channels-macos/17"
      - name: ConversationRelay rollback preserves GPT-Live tasks and receipts
        env: *phone_env
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/channels-macos/18"
      - name: CLI integration compiles
        env: *phone_env
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/channels-macos/19"
      - name: Phone lint
        env: *phone_env
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/channels-macos/20"
      - name: Upload offline phone evidence (not live qualification)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phone-offline-macos-latest
          path: |
            target/phone-offline/
            target/phone-upgrade/
            target/phone-live-upgrade/
          if-no-files-found: error

  platform-macos:
    # Mirrors platform.yml `platform`.
    name: platform (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.94.1
      # Restore-only: rust-cache.yml writes this cache from main. Build
      # parallelism doesn't change artifacts, so it stays out of the cache key.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ci
          env-vars: ImageOS
          save-if: false
        env:
          CARGO_BUILD_JOBS: ''
      - name: Build the CLI
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/platform-macos/3"
      # Every workflow here builds a per-crate SUBSET, so a crate that nothing
      # in CI compiles can break `main` while every check stays green. That is
      # not hypothetical: `augmentagent-channel-whatsapp` was left uncompilable
      # by #1110 and CI never noticed. The auto-PR loop did — its verification
      # gate runs `cargo build --workspace` — and it spent its entire daily cap
      # blaming its own builder for a breakage it did not cause.
      #
      # The daily scanner already runs a workspace build, but on a schedule, so
      # main can sit broken for a day. This is the PR gate, so it belongs here.
      - name: Whole workspace compiles
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/platform-macos/4"

      - name: Agent Composio authentication
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/platform-macos/5"
      - name: Owner alerts and iMessage delivery
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/platform-macos/6"
      - name: Discord actionable alerts and preparation reminders
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/platform-macos/7"
      - name: Process walker + sidecar clients
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/platform-macos/8"

      # #1226 / #1282 — the transport-neutral surface contracts and the Slack
      # identity/capability mapping must hold on both hosts. #1285 — the
      # durable inbox/outbox restart, reconcile and catch-up tests too, and
      # their status/doctor visibility. #1286 — owner binding, rejection
      # audit and Slack owner authorization/echo rejection.
      - name: Surface contracts (shared + Slack)
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/platform-macos/9"
      # #1283 — the Slack Socket Mode transport must build and pass on both
      # hosts (rustls WebSocket, heartbeat/sleep-wake recovery, Web API).
      - name: Slack transport
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/platform-macos/10"
      # #1294 — outbound delivery: mrkdwn conversion and mention
      # neutralisation, lossless splitting, multi-part outbox planning with
      # restart/reconcile, file upload over a mock Slack, throttled progress
      # (paused clock), and `slack deliver` end to end. No network.
      - name: Slack outbound delivery
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/platform-macos/11"
      # #1293 — owner-sent files: authenticated download from Slack file
      # hosts only (redirects, size cap while streaming, timeout, cancel),
      # the inbound pipeline (images, text, PDF/DOCX via fake converters,
      # attachment-only messages, rejections, cleanup, case-colliding names),
      # the shared attachment policy and bounded converter lookup, Discord's
      # partition/prompt on the shared policy, and `slack files fetch` end to
      # end against a mock Slack. No network.
      - name: Slack inbound files
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/platform-macos/12"
      # #1287 — the interactive Slack surface on its real dispatch path
      # (Socket Mode over an in-memory WebSocket, durable inbox/outbox, owner
      # gate, restart/shutdown/dry-run), the listener-health store, the serve
      # wiring, and the built `serve` running Slack only against a local fake
      # Slack, including Discord/WhatsApp failing beside it. No network.
      - name: Slack interactive surface in serve
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/platform-macos/13"
      # #1297 — Slack voice clips and spoken replies: clip detection,
      # download + fake ffmpeg decode + scripted speech providers (credit
      # fallback, failures, limits, cleanup), non-owner audio never reaching
      # a provider through admit, spoken replies as audio + text mirror
      # delivered once, and `slack voice transcribe|speak` end to end against
      # a mock Slack. Synthetic audio, no network, no paid provider.
      # In serve: owner clips as turns with the transcript shown, `voice
      # on|off|status` persisted per conversation, spoken answers on the real
      # dispatch path, and the Rust TTS adapter against a local HTTP mock.
      - name: Slack voice clips and spoken replies
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/platform-macos/14"
      # #1288 — Slack owner turns through the shared harness: native session
      # per conversation, claim before execution, queueing, cancel, restart
      # recovery, owner files under the read-only scope-guard carve-out, and
      # the shared session conformance scenario against Discord and Slack.
      - name: Slack conversation harness
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/platform-macos/15"

      # #1289 — approvals on Slack: cards, clicks, modals, presets, text
      # commands and recompose through the shared handler on the real
      # dispatch path; card pointers; cross-surface redraw with one send
      # across Slack and Discord; Slack contact replies claimed before
      # sending; and the built Slack-only `serve` carding and sending once.
      - name: Slack approvals
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/platform-macos/16"
      # #1290 — Slack contact replies and compose: thread targeting, sending
      # as the owner through the Composio user connection (never the bot),
      # the per-action send ledger (retry without duplication), compose
      # through the wiki identity layer (ambiguous asks, unknown refuses),
      # and nothing from the owner's conversation reaching a contact.
      - name: Slack contact sends
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/platform-macos/17"
      # #1291 — scheduled sends on Slack: schedule/confirm/reschedule/send
      # now/back to queue/cancel on cards and as text commands, the resolved
      # time with its zone (compiled-in tz rules, so both hosts agree), DST
      # gap and overlap, the notice redrawn in place and across surfaces, and
      # the shared scheduler with a fake clock: fires once (also across
      # restart), missed-schedule window, Slack sends through the contact
      # ledger. No network, no wall-clock waits.
      - name: Slack scheduled sends
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/platform-macos/18"
      # #1296 — subscribed Slack conversations: one record and one triage
      # whichever path (live event, Composio poll, catch-up) sees a message
      # first; edits/deletes once; thread replies attach to their parent;
      # renames keep IDs; an existing Slack DB migrates with IDs and cursors
      # unchanged; bounded catch-up after a fake-clock suspension;
      # subscription management by name/person/ID (library, Slack command
      # hook and the real CLI against a mock Composio); harness history;
      # search by person and channel. Temporary stores, no network.
      - name: Slack subscriptions, reconciliation and search
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/platform-macos/19"
      # #1284 — Slack app install/verify/rotate/remove: manifest contract,
      # credential lifecycle (in-memory store) and the real CLI against a
      # mock Slack with the file credential store. No Keychain, no network.
      # #1286 — owner bind/show/unbind and control channel selection.
      - name: Slack app credentials and CLI
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/platform-macos/20"
      # #1325 — credentials persist on Linux. The owner-only file store
      # (0700/0600, atomic writes, corrupt slots, redaction, one-way
      # read-through from the legacy keyring, a second process reading what
      # the first wrote) on both hosts; on Linux, the same through the
      # default store for the auth crate alone and for the real binary with
      # the workspace's keyring features (`slack app install` in one
      # process, `slack app status`/`status`/`doctor` in the next). No D-Bus
      # session, no keyring, no network; the macOS CLI test is ignored there.
      - name: Credential persistence (#1325)
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/platform-macos/21"
      # #1299 — Slack operations: status/doctor setup steps, credential
      # backend and plaintext-store flags, the daemon's start report
      # (Discord broker off), reconnect count, a log scan for synthetic
      # tokens and message bodies, upgrade/rollback of a pre-#1299 state,
      # and every runbook command parsed by the real CLI. No network, no
      # Keychain (the auth crate's backend test runs in the step above).
      - name: Slack operations, upgrade and runbook
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/platform-macos/22"
      # #1292 — Discord's owner commands on Slack: the shared registry
      # against Discord's dispatcher (every command mapped or a named
      # blocker), parse/authorize/execute/persist/reply per command, the
      # private command lane, reset (new native session), cancel all,
      # per-conversation model selection across restart, loop delivery to a
      # Slack destination on a paused clock, and the process walker.
      - name: Slack owner commands
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/platform-macos/23"
      # #1295 — proactive notifications on Slack: the producer registry
      # (every posting site registered), per-class Discord/Slack routing,
      # Slack-only, one surface failing, and the outbox's dedupe, pacing and
      # late marking after a suspension on a fake clock.
      - name: Slack notifications
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/platform-macos/24"
      # #1300 — the Slack parity gate. The executable matrix
      # (docs/slack-parity-matrix.json) must pass its check against this
      # tree and the Slack capability tables; then every named test it
      # lists (each epic row, and the shared scenarios run for Slack,
      # Discord and WhatsApp) plus the Discord and WhatsApp regression
      # suites run from that one list, on both hosts. No network.
      - name: Slack parity gate
        shell: bash
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/platform-macos/25"
      - name: Host-dependent CLI surface
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/platform-macos/26"
      - name: CLI smoke on this host
        shell: bash
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/platform-macos/27"
      - name: macOS parity inventory guard
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/platform-macos/28"

      - name: Sidecar installer and socket ownership contracts
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/platform-macos/29"

      - name: Updater + installer shell suites
        shell: bash
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/platform-macos/30"
      - name: Launchd installer contract tests
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/platform-macos/31"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Fetch sidecar protocol and synthetic page
        working-directory: sidecars/fetch
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/platform-macos/33"
      - name: Renderer synthetic media artifact
        working-directory: sidecars/renderer
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id macos/platform-macos/34"
