name: no-gmail-authors
# Blocks any commit in a PR whose author/committer email is a personal gmail
# address — the git-config regression #358 exists to stop. Existing history is
# scrubbed separately (the owner-gated filter-repo pass, #358/#359); this guards
# new commits going forward so the regression can't reappear.
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Reject gmail author/committer emails on new commits
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id no-gmail-authors/check/1 --input-base \"${{ github.event.pull_request.base.sha }}\" --input-head \"${{ github.event.pull_request.head.sha }}\""
