name: Phone offline acceptance

on:
  pull_request:
    paths:
      - 'crates/augmentagent-phone/**'
      - 'crates/augmentagent-store/**'
      - 'crates/augmentagent-docs/**'
      - 'crates/augmentagent-channel-journal/**'
      - 'crates/augmentagent-channel-core/**'
      - 'crates/augmentagent-cli/**'
      - 'crates/augmentagent-approval-discord/**'
      - 'crates/augmentagent-channel-slack/**'
      - 'crates/augmentagent-channel-whatsapp/**'
      - 'crates/augmentagent-channel-whatsapp-history/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/aa-wiki-protected-names.sh'
      - 'scripts/aa-journal-guard.sh'
      - 'scripts/tests/aa-journal-guard.test.sh'
      - 'scripts/phone-offline-tests.py'
      - 'scripts/phone-upgrade-test.py'
      - 'scripts/install-autostart.sh'
      - 'scripts/lib/launchd-install.sh'
      - 'scripts/tests/install-autostart.test.sh'
      - 'scripts/tests/phone_offline_ci_test.py'
      - 'scripts/phone-live-receipt.py'
      - 'scripts/tests/phone_live_receipt_test.py'
      - '.github/workflows/phone.yml'
      - "scripts/ci-contract.py"
      - "scripts/ci-contract.json"
      - "scripts/ci-contract-sync.py"
      - "scripts/tests/ci_contract_test.py"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      AUGMENTAGENT_GH_DISABLE: '1'
      AUGMENTAGENT_PHONE_ENABLED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.94.1
          components: clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: phone-offline
      - name: Check that the runner rejects missing or skipped coverage
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id phone/offline/4"
      - name: Live receipt validator (synthetic fixtures only)
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id phone/offline/5"
      - name: Portable bridge search and parent lifetime
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id phone/offline/6"
      - name: Journal write guard including portable path resolution
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id phone/offline/7"
      - name: Compile opt-in native phone probes (no model calls)
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id phone/offline/8"
      - name: Required offline suites
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id phone/offline/9"
      - name: Service installation preserves private phone configuration
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id phone/offline/10"
      - name: Pre-phone database upgrade and rollback compatibility
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id phone/offline/11"
      - name: ConversationRelay rollback preserves GPT-Live tasks and receipts
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id phone/offline/12"
      - name: CLI integration compiles
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id phone/offline/13"
      - name: Phone lint
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id phone/offline/14"
      - name: Upload offline evidence (not live qualification)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phone-offline-${{ matrix.os }}
          path: |
            target/phone-offline/
            target/phone-upgrade/
            target/phone-live-upgrade/
          if-no-files-found: error
