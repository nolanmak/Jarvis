name: PDF generation
on:
  pull_request:
    paths: &pdf_paths
      - 'crates/augmentagent-docs/**'
      - 'crates/augmentagent-cli/**'
      - 'crates/augmentagent-channel-core/src/reasoner.rs'
      - 'crates/augmentagent-approval-discord/**'
      - 'crates/augmentagent-store/src/document_signatures.rs'
      - 'schema/wiki-ask.md'
      - 'Cargo.*'
      - '.github/workflows/pdf-generation.yml'
      - 'scripts/pdf-runtime.py'
      - 'scripts/run-rs.sh'
      - 'scripts/install-autostart.sh'
      - 'scripts/check-for-updates.sh'
      - 'scripts/tests/*pdf*'
      - 'scripts/tests/updater*.sh'
      - "scripts/ci-contract.py"
      - "scripts/ci-contract.json"
      - "scripts/ci-contract-sync.py"
      - "scripts/tests/ci_contract_test.py"
      - "scripts/ci-contract.py"
      - "scripts/ci-contract.json"
      - "scripts/ci-contract-sync.py"
      - "scripts/tests/ci_contract_test.py"
  push:
    branches: [main]
    paths: *pdf_paths
permissions:
  contents: read
# Superseded PR heads cancel; non-PR runs retain distinct queue slots.
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
  pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id pdf-generation/pdf/4"

      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id pdf-generation/pdf/5"

      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id pdf-generation/pdf/6"

      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id pdf-generation/pdf/7"

      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id pdf-generation/pdf/8"

      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id pdf-generation/pdf/9"

      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id pdf-generation/pdf/10"

      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id pdf-generation/pdf/11"

      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id pdf-generation/pdf/12"

      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id pdf-generation/pdf/13"

      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id pdf-generation/pdf/14"

      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id pdf-generation/pdf/15"

      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id pdf-generation/pdf/16"

      - name: Read-only repository documents and delivery CLI
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id pdf-generation/pdf/17"
