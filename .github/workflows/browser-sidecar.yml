name: Browser sidecar (Linux + macOS)

on:
  pull_request:
    paths:
      - 'sidecars/browser/**'
      - 'scripts/start-sidecar.py'
      - 'crates/augmentagent-browser-client/**'
      - 'crates/augmentagent-cli/src/installers.rs'
      - 'systemd/augmentagent-browser-sidecar.service'
      - '.github/workflows/browser-sidecar.yml'
  push:
    branches: [main]
    paths:
      - 'sidecars/browser/**'
      - 'scripts/start-sidecar.py'
      - 'crates/augmentagent-browser-client/**'
      - 'crates/augmentagent-cli/src/installers.rs'
      - 'systemd/augmentagent-browser-sidecar.service'
      - '.github/workflows/browser-sidecar.yml'

permissions:
  contents: read

jobs:
  synthetic-page:
    name: synthetic-page (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sidecars/browser/requirements.txt
      - name: Install pinned browser runtime
        run: bash sidecars/browser/setup.sh
      - name: Synthetic page and restart contract
        run: sidecars/browser/.venv/bin/python -m unittest sidecars.browser.test_smoke -v
