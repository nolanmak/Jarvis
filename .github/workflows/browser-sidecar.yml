name: Browser sidecar (Linux + macOS)

on:
  pull_request:
    paths:
      - 'sidecars/browser/**'
      - 'scripts/start-sidecar.py'
      - 'crates/augmentagent-browser-client/**'
      - 'crates/augmentagent-cli/src/installers.rs'
      - 'systemd/augmentagent-browser-sidecar.service'
      - '.github/workflows/browser-sidecar.yml'
      - "scripts/ci-contract.py"
      - "scripts/ci-contract.json"
      - "scripts/ci-contract-sync.py"
      - "scripts/tests/ci_contract_test.py"
  push:
    branches: [main]
    paths:
      - 'sidecars/browser/**'
      - 'scripts/start-sidecar.py'
      - 'crates/augmentagent-browser-client/**'
      - 'crates/augmentagent-cli/src/installers.rs'
      - 'systemd/augmentagent-browser-sidecar.service'
      - '.github/workflows/browser-sidecar.yml'

      - "scripts/ci-contract.py"
      - "scripts/ci-contract.json"
      - "scripts/ci-contract-sync.py"
      - "scripts/tests/ci_contract_test.py"
permissions:
  contents: read

# Superseded PR heads cancel; non-PR runs retain distinct queue slots.
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
  synthetic-page:
    name: synthetic-page (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sidecars/browser/requirements.txt
      - name: Install pinned browser runtime
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id browser-sidecar/synthetic-page/2"

      - name: Synthetic page and restart contract
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id browser-sidecar/synthetic-page/3"
