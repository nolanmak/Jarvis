name: Browser sidecar (Linux + macOS)

on:
  pull_request:
    paths:
      - 'sidecars/browser/**'
      - 'scripts/start-sidecar.py'
      - 'crates/augmentagent-browser-client/**'
      - 'crates/augmentagent-cli/src/installers.rs'
      - 'systemd/augmentagent-browser-sidecar.service'
      - '.github/workflows/browser-sidecar.yml'
      - "scripts/ci-contract.py"
      - "scripts/ci-contract.json"
      - "scripts/ci-contract-sync.py"
      - "scripts/tests/ci_contract_test.py"
  push:
    branches: [main]
    paths:
      - 'sidecars/browser/**'
      - 'scripts/start-sidecar.py'
      - 'crates/augmentagent-browser-client/**'
      - 'crates/augmentagent-cli/src/installers.rs'
      - 'systemd/augmentagent-browser-sidecar.service'
      - '.github/workflows/browser-sidecar.yml'

      - "scripts/ci-contract.py"
      - "scripts/ci-contract.json"
      - "scripts/ci-contract-sync.py"
      - "scripts/tests/ci_contract_test.py"
permissions:
  contents: read

jobs:
  synthetic-page:
    name: synthetic-page (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sidecars/browser/requirements.txt
      - name: Install pinned browser runtime
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id browser-sidecar/synthetic-page/2"

      - name: Synthetic page and restart contract
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id browser-sidecar/synthetic-page/3"
