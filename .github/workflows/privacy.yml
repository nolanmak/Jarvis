name: Release privacy checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test privacy gate
        run: python3 scripts/tests/check-no-personal-data.test.py
      - name: Check tracked files, including templates
        run: bash scripts/check-no-personal-data.sh --tracked
      - name: Install pinned secret scanner
        shell: bash
        run: |
          set -euo pipefail
          url=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --location --silent --show-error "$url" -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan exactly the release tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/release-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/release-source"
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/release-source" --redact=100 --no-banner
