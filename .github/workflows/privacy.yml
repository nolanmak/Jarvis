name: Release privacy checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded PR heads cancel; non-PR runs retain distinct queue slots.
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test privacy gate
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id privacy/privacy/1"
      - name: Check tracked files, including templates
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id privacy/privacy/2"

      - name: Install pinned secret scanner
        shell: bash
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id privacy/privacy/3"
      - name: Scan exactly the release tree
        shell: bash
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id privacy/privacy/4"
  node-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id privacy/node-release/2"

      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id privacy/node-release/3"

      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id privacy/node-release/4"

      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id privacy/node-release/5"
