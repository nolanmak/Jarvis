name: WhatsApp sidecar contract

on:
  pull_request:
    paths:
      - 'sidecars/wa-sidecar/**'
      - 'crates/augmentagent-channel-whatsapp/**'
      - 'docs/fixtures/whatsapp/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/whatsapp-sidecar.yml'

      - "scripts/ci-contract.py"
      - "scripts/ci-contract.json"
      - "scripts/ci-contract-sync.py"
      - "scripts/tests/ci_contract_test.py"
permissions:
  contents: read

jobs:
  wire-contract:
    name: wire-contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      GOMAXPROCS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: sidecars/wa-sidecar/go.sum
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.94.1
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Go tests, race checks and vet
        working-directory: sidecars/wa-sidecar
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id whatsapp-sidecar/wire-contract/4"
      - name: Build exact sidecar used by Rust contract tests
        working-directory: sidecars/wa-sidecar
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id whatsapp-sidecar/wire-contract/5"
      - name: Rust channel and real Go-process contract tests
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id whatsapp-sidecar/wire-contract/6"

      - name: Rust channel lint
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id whatsapp-sidecar/wire-contract/7"
