name: Platform (Linux + macOS)

# #1079 — the daemon runs under systemd on Linux and launchd on macOS. This
# builds and tests the host-dependent surface on both so neither side can
# silently regress: service/status/logs/installers/doctor probes, the
# process walker, sidecar socket paths, and the updater's restart library.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.94.1
      # Restore-only: rust-cache.yml writes this cache from main. Build
      # parallelism doesn't change artifacts, so it stays out of the cache key.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ci
          env-vars: ImageOS
          save-if: false
        env:
          CARGO_BUILD_JOBS: ''
      - name: Build the CLI
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id platform/platform/3"

      - name: Build storage admission and rollback retention (Linux)
        if: runner.os == 'Linux'
        env:
          AUGMENTAGENT_GH_DISABLE: '1'
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id platform/platform/4"
      # Every workflow here builds a per-crate SUBSET, so a crate that nothing
      # in CI compiles can break `main` while every check stays green. That is
      # not hypothetical: `augmentagent-channel-whatsapp` was left uncompilable
      # by #1110 and CI never noticed. The auto-PR loop did — its verification
      # gate runs `cargo build --workspace` — and it spent its entire daily cap
      # blaming its own builder for a breakage it did not cause.
      #
      # The daily scanner already runs a workspace build, but on a schedule, so
      # main can sit broken for a day. This is the PR gate, so it belongs here.
      - name: Whole workspace compiles
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id platform/platform/5"

      - name: Agent Composio authentication
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id platform/platform/6"
      - name: Owner alerts and iMessage delivery
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id platform/platform/7"
      - name: Discord actionable alerts and preparation reminders
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id platform/platform/8"
      - name: Process walker + sidecar clients
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id platform/platform/9"

      # #1226 / #1282 — the transport-neutral surface contracts and the Slack
      # identity/capability mapping must hold on both hosts. #1285 — the
      # durable inbox/outbox restart, reconcile and catch-up tests too, and
      # their status/doctor visibility. #1286 — owner binding, rejection
      # audit and Slack owner authorization/echo rejection.
      - name: Surface contracts (shared + Slack)
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id platform/platform/10"
      # #1283 — the Slack Socket Mode transport must build and pass on both
      # hosts (rustls WebSocket, heartbeat/sleep-wake recovery, Web API).
      - name: Slack transport
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id platform/platform/11"
      # #1294 — outbound delivery: mrkdwn conversion and mention
      # neutralisation, lossless splitting, multi-part outbox planning with
      # restart/reconcile, file upload over a mock Slack, throttled progress
      # (paused clock), and `slack deliver` end to end. No network.
      - name: Slack outbound delivery
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id platform/platform/12"
      # #1293 — owner-sent files: authenticated download from Slack file
      # hosts only (redirects, size cap while streaming, timeout, cancel),
      # the inbound pipeline (images, text, PDF/DOCX via fake converters,
      # attachment-only messages, rejections, cleanup, case-colliding names),
      # the shared attachment policy and bounded converter lookup, Discord's
      # partition/prompt on the shared policy, and `slack files fetch` end to
      # end against a mock Slack. No network.
      - name: Slack inbound files
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id platform/platform/13"
      # #1287 — the interactive Slack surface on its real dispatch path
      # (Socket Mode over an in-memory WebSocket, durable inbox/outbox, owner
      # gate, restart/shutdown/dry-run), the listener-health store, the serve
      # wiring, and the built `serve` running Slack only against a local fake
      # Slack, including Discord/WhatsApp failing beside it. No network.
      - name: Slack interactive surface in serve
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id platform/platform/14"
      # #1297 — Slack voice clips and spoken replies: clip detection,
      # download + fake ffmpeg decode + scripted speech providers (credit
      # fallback, failures, limits, cleanup), non-owner audio never reaching
      # a provider through admit, spoken replies as audio + text mirror
      # delivered once, and `slack voice transcribe|speak` end to end against
      # a mock Slack. Synthetic audio, no network, no paid provider.
      # In serve: owner clips as turns with the transcript shown, `voice
      # on|off|status` persisted per conversation, spoken answers on the real
      # dispatch path, and the Rust TTS adapter against a local HTTP mock.
      - name: Slack voice clips and spoken replies
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id platform/platform/15"
      # #1288 — Slack owner turns through the shared harness: native session
      # per conversation, claim before execution, queueing, cancel, restart
      # recovery, owner files under the read-only scope-guard carve-out, and
      # the shared session conformance scenario against Discord and Slack.
      - name: Slack conversation harness
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id platform/platform/16"
      # The real scope-guard script, including the Slack inbound carve-out
      # (#1288). Linux only: on macOS the script's older cases rely on GNU
      # `readlink -m`, which BSD readlink lacks; the Slack carve-out itself
      # is covered on both hosts by the codex_tools tests above, which run
      # the same script.
      - name: Wiki scope guard script (Linux)
        if: runner.os == 'Linux'
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id platform/platform/17"

      # #1289 — approvals on Slack: cards, clicks, modals, presets, text
      # commands and recompose through the shared handler on the real
      # dispatch path; card pointers; cross-surface redraw with one send
      # across Slack and Discord; Slack contact replies claimed before
      # sending; and the built Slack-only `serve` carding and sending once.
      - name: Slack approvals
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id platform/platform/18"
      # #1290 — Slack contact replies and compose: thread targeting, sending
      # as the owner through the Composio user connection (never the bot),
      # the per-action send ledger (retry without duplication), compose
      # through the wiki identity layer (ambiguous asks, unknown refuses),
      # and nothing from the owner's conversation reaching a contact.
      - name: Slack contact sends
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id platform/platform/19"
      # #1291 — scheduled sends on Slack: schedule/confirm/reschedule/send
      # now/back to queue/cancel on cards and as text commands, the resolved
      # time with its zone (compiled-in tz rules, so both hosts agree), DST
      # gap and overlap, the notice redrawn in place and across surfaces, and
      # the shared scheduler with a fake clock: fires once (also across
      # restart), missed-schedule window, Slack sends through the contact
      # ledger. No network, no wall-clock waits.
      - name: Slack scheduled sends
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id platform/platform/20"
      # #1296 — subscribed Slack conversations: one record and one triage
      # whichever path (live event, Composio poll, catch-up) sees a message
      # first; edits/deletes once; thread replies attach to their parent;
      # renames keep IDs; an existing Slack DB migrates with IDs and cursors
      # unchanged; bounded catch-up after a fake-clock suspension;
      # subscription management by name/person/ID (library, Slack command
      # hook and the real CLI against a mock Composio); harness history;
      # search by person and channel. Temporary stores, no network.
      - name: Slack subscriptions, reconciliation and search
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id platform/platform/21"
      # #1284 — Slack app install/verify/rotate/remove: manifest contract,
      # credential lifecycle (in-memory store) and the real CLI against a
      # mock Slack with the file credential store. No Keychain, no network.
      # #1286 — owner bind/show/unbind and control channel selection.
      - name: Slack app credentials and CLI
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id platform/platform/22"
      # #1325 — credentials persist on Linux. The owner-only file store
      # (0700/0600, atomic writes, corrupt slots, redaction, one-way
      # read-through from the legacy keyring, a second process reading what
      # the first wrote) on both hosts; on Linux, the same through the
      # default store for the auth crate alone and for the real binary with
      # the workspace's keyring features (`slack app install` in one
      # process, `slack app status`/`status`/`doctor` in the next). No D-Bus
      # session, no keyring, no network; the macOS CLI test is ignored there.
      - name: Credential persistence (#1325)
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id platform/platform/23"
      # #1299 — Slack operations: status/doctor setup steps, credential
      # backend and plaintext-store flags, the daemon's start report
      # (Discord broker off), reconnect count, a log scan for synthetic
      # tokens and message bodies, upgrade/rollback of a pre-#1299 state,
      # and every runbook command parsed by the real CLI. No network, no
      # Keychain (the auth crate's backend test runs in the step above).
      - name: Slack operations, upgrade and runbook
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id platform/platform/24"
      # #1292 — Discord's owner commands on Slack: the shared registry
      # against Discord's dispatcher (every command mapped or a named
      # blocker), parse/authorize/execute/persist/reply per command, the
      # private command lane, reset (new native session), cancel all,
      # per-conversation model selection across restart, loop delivery to a
      # Slack destination on a paused clock, and the process walker.
      - name: Slack owner commands
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id platform/platform/25"
      # #1295 — proactive notifications on Slack: the producer registry
      # (every posting site registered), per-class Discord/Slack routing,
      # Slack-only, one surface failing, and the outbox's dedupe, pacing and
      # late marking after a suspension on a fake clock.
      - name: Slack notifications
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id platform/platform/26"
      # #1300 — the Slack parity gate. The executable matrix
      # (docs/slack-parity-matrix.json) must pass its check against this
      # tree and the Slack capability tables; then every named test it
      # lists (each epic row, and the shared scenarios run for Slack,
      # Discord and WhatsApp) plus the Discord and WhatsApp regression
      # suites run from that one list, on both hosts. No network.
      - name: Slack parity gate
        shell: bash
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id platform/platform/27"
      - name: Host-dependent CLI surface
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id platform/platform/28"
      - name: CLI smoke on this host
        shell: bash
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id platform/platform/29"
      - name: macOS parity inventory guard
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id platform/platform/30"

      - name: Sidecar installer and socket ownership contracts
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id platform/platform/31"

      - name: Updater + installer shell suites
        shell: bash
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id platform/platform/32"
      - name: Launchd installer contract tests
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id platform/platform/33"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Fetch sidecar protocol and synthetic page
        working-directory: sidecars/fetch
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id platform/platform/35"
      - name: Renderer synthetic media artifact
        working-directory: sidecars/renderer
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id platform/platform/36"
