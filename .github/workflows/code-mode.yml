name: Code Mode
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# Superseded PR heads cancel; non-PR runs retain distinct queue slots.
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      # Required real-VM acceptance runs separately on the provisioned host.
      JARVIS_TEST_VM_CONFIG: ""
      JARVIS_TEST_COMPUTE_PIP: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: 2.7.14
      - name: Install trusted host parser
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id code-mode/deterministic/4"
      - name: Validate CI refusal behavior
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id code-mode/deterministic/5"

      - name: Rust, CLI and Deno contracts
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id code-mode/deterministic/6"

      - name: Embedded helper update triggers
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id code-mode/deterministic/7"
