name: Dashboard sessions (Linux + macOS)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded PR heads cancel; non-PR runs retain distinct queue slots.
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
  sessions:
    name: sessions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Record OS, architecture and runtime
        shell: bash
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id dashboard-sessions/sessions/2"
      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id dashboard-sessions/sessions/3"

      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id dashboard-sessions/sessions/4"

      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id dashboard-sessions/sessions/5"

      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id dashboard-sessions/sessions/6"
