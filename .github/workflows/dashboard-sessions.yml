name: Dashboard sessions (Linux + macOS)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sessions:
    name: sessions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Record OS, architecture and runtime
        shell: bash
        run: |
          uname -srm
          if [ "$(uname -s)" = Darwin ]; then sw_vers; fi
          node --version
          npm --version
      - run: npm ci
      - run: npm run build
      - run: node --test test/sessionProcesses.test.js
      - run: npm test
