name: Codex bridge suites

# #1048: the Codex tool bridge is the enforcement boundary for the fallback
# path. Its Python suites (bridge, command sandbox, build VM, dependency proxy)
# run on every PR and on main. Owner-run suites (live providers, real VM via
# JARVIS_TEST_VM_CONFIG) skip here; see docs/TESTING.md.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded PR heads cancel; non-PR runs retain distinct queue slots.
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
  bridge-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The runner must enforce the sandbox: a missing Landlock ABI 6,
      # libseccomp or Poppler fails the report step and every sandbox test
      # instead of skipping them (local runs still skip).
      REQUIRE_ENFORCEABLE_SANDBOX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install renderer, syscall-filter library and ripgrep
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id bridge-suites/bridge-suites/1"
      - name: Report sandbox capabilities
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id bridge-suites/bridge-suites/2"

      - name: Require the enforcement and compute suites
        shell: bash
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id bridge-suites/bridge-suites/3"
      - name: Run Python suites
        working-directory: scripts
        # Live and VM suites need explicit opt-in env vars and skip without them.
        env:
          JARVIS_TEST_VM_CONFIG: ""
          JARVIS_TEST_LIVE_DISCOVERY: ""
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id bridge-suites/bridge-suites/4"

      - name: Test native provider gateway and launcher contracts
        # Real VM and authenticated provider acceptance run on the provisioned host.
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id bridge-suites/bridge-suites/5"
      - name: Test the PR verification gate's bridge-suite receipt rule
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id bridge-suites/bridge-suites/6"
