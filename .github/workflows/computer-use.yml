name: General computer use
on:
  pull_request:
    paths:
      - 'sidecars/computer-use/**'
      - 'scripts/install-computer-use.sh'
      - 'scripts/uninstall-computer-use.sh'
      - 'scripts/tests/computer-use-launchd.test.sh'
      - 'scripts/check-for-updates.sh'
      - 'scripts/codex-tool-bridge.py'
      - 'scripts/tests/codex_tool_bridge_test.py'
      - 'crates/augmentagent-cli/src/computer_tool.rs'
      - '.github/workflows/computer-use.yml'
      - "scripts/ci-contract.py"
      - "scripts/ci-contract.json"
      - "scripts/ci-contract-sync.py"
      - "scripts/tests/ci_contract_test.py"
jobs:
  browser:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sidecars/computer-use/package-lock.json
      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id computer-use/browser/2"

        working-directory: sidecars/computer-use
      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id computer-use/browser/3"

        if: runner.os == 'Linux'
        working-directory: sidecars/computer-use
      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id computer-use/browser/4"

        if: runner.os == 'macOS'
        working-directory: sidecars/computer-use
      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id computer-use/browser/5"

      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id computer-use/browser/6"

        if: runner.os == 'Linux'
        working-directory: sidecars/computer-use
      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id computer-use/browser/7"

        if: runner.os == 'macOS'
        working-directory: sidecars/computer-use
      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id computer-use/browser/8"
