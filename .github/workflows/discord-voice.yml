name: Discord voice

on:
  pull_request:
    paths:
      - 'sidecars/discord-voice/**'
      - 'crates/augmentagent-approval-discord/**'
      - 'crates/augmentagent-channel-core/**'
      - 'crates/augmentagent-cli/**'
      - 'crates/augmentagent-store/**'
      - 'docs/discord-voice/**'
      - 'systemd/augmentagent-discord-voice.service'
      - 'scripts/tests/voice_package_platform_test.py'
      - '.github/workflows/discord-voice.yml'
  push:
    branches: [main]
    paths:
      - 'sidecars/discord-voice/**'
      - 'crates/augmentagent-approval-discord/**'
      - 'crates/augmentagent-channel-core/**'
      - 'crates/augmentagent-cli/**'
      - 'crates/augmentagent-store/**'
      - 'docs/discord-voice/**'
      - 'systemd/augmentagent-discord-voice.service'
      - 'scripts/tests/voice_package_platform_test.py'
      - '.github/workflows/discord-voice.yml'

permissions:
  contents: read

jobs:
  sidecar:
    name: sidecar (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sidecars/discord-voice
    steps:
      - uses: actions/checkout@v4
      - name: Record native target
        run: uname -srm
        working-directory: .
      - name: Check required package portability
        run: python3 -m unittest scripts.tests.voice_package_platform_test -v
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'
          cache: npm
          cache-dependency-path: sidecars/discord-voice/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=optional --audit-level=high
      # Live calls require a disposable guild and provider credentials. They
      # remain explicit opt-in verification, never synthetic CI success.

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: discord-voice
      - run: cargo test -p augmentagent-approval-discord -p augmentagent-channel-core -p augmentagent-channel-voice -p augmentagent-store --locked
      - run: cargo test -p augmentagent-cli --bin augmentagent --locked -- --test-threads=1
