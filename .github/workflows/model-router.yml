name: Model router
on:
  pull_request:
    paths:
      - 'crates/augmentagent-channel-core/**'
      - 'crates/augmentagent-approval-discord/**'
      - 'crates/augmentagent-cli/**'
      - 'scripts/runpod-adapter/**'
      - 'scripts/reasoner-fault-injection/**'
      - 'src/modelRouter*'
      - 'src/dashboard.ts'
      - 'views/model-*'
      - 'test/modelRouter*'
      - 'scripts/*model-router*'
      - 'scripts/tests/model_router*'
      - 'scripts/tests/run_model_router_image_fixture.py'
      - 'scripts/tests/verify_codex_redirect.py'
      - 'scripts/tests/test_verify_codex_redirect.py'
      - 'sidecars/9router/**'
      - '.github/workflows/model-router.yml'
  push:
    branches: [main]
    paths:
      - 'crates/augmentagent-channel-core/**'
      - 'crates/augmentagent-approval-discord/**'
      - 'crates/augmentagent-cli/**'
      - 'scripts/runpod-adapter/**'
      - 'scripts/reasoner-fault-injection/**'
      - 'src/modelRouter*'
      - 'src/dashboard.ts'
      - 'views/model-*'
      - 'test/modelRouter*'
      - 'scripts/*model-router*'
      - 'scripts/tests/model_router*'
      - 'scripts/tests/run_model_router_image_fixture.py'
      - 'scripts/tests/verify_codex_redirect.py'
      - 'scripts/tests/test_verify_codex_redirect.py'
      - 'sidecars/9router/**'
      - '.github/workflows/model-router.yml'
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: python3 -m unittest discover -s scripts/tests -p model_router_install_test.py
      - run: python3 -m unittest discover -s scripts/runpod-adapter -p 'test_*.py'
  adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p augmentagent-channel-core --lib
      - run: cargo test -p augmentagent-approval-discord --lib
      - run: cargo check -p augmentagent-cli
      - name: Pin each Discord model and exercise the audited tool probe
        run: cargo test -p augmentagent-cli --test reasoner_failover_e2e selftest_ -- --nocapture
  pinned-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned 9Router with the reconciliation patch
        run: bash scripts/build-model-router-image.sh
      - name: Exercise account failover, request identity and media refusal
        run: python3 scripts/tests/run_model_router_image_fixture.py
  codex-redirect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Codex client
        run: npm install --global @openai/codex@0.154.0
      - name: Prove the gate detects credential forwarding
        run: python3 -m unittest discover -s scripts/tests -p test_verify_codex_redirect.py
      - name: Refuse router credential on a cross-origin redirect
        run: python3 scripts/tests/verify_codex_redirect.py
  adapter-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exercise private adapter deployment with paused synthetic routes
        run: python3 scripts/runpod-adapter/test_compose_deployment.py
