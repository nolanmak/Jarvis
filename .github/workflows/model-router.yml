name: Model router
on:
  pull_request:
    paths:
      - 'crates/augmentagent-channel-core/**'
      - 'crates/augmentagent-approval-discord/**'
      - 'crates/augmentagent-cli/**'
      - 'scripts/runpod-adapter/**'
      - 'scripts/reasoner-fault-injection/**'
      - 'src/modelRouter*'
      - 'src/dashboard.ts'
      - 'views/model-*'
      - 'test/modelRouter*'
      - 'scripts/*model-router*'
      - 'scripts/*runpod-adapter*'
      - 'scripts/lib/install-launchd-plist.sh'
      - 'scripts/macos_parity_inventory.py'
      - 'docs/macos-parity-inventory.json'
      - 'scripts/tests/model_router*'
      - 'scripts/tests/runpod_adapter_install_test.py'
      - 'scripts/tests/run_model_router_image_fixture.py'
      - 'scripts/tests/verify_codex_redirect.py'
      - 'scripts/tests/test_verify_codex_redirect.py'
      - 'sidecars/9router/**'
      - '.github/workflows/model-router.yml'
      - "scripts/ci-contract.py"
      - "scripts/ci-contract.json"
      - "scripts/ci-contract-sync.py"
      - "scripts/tests/ci_contract_test.py"
  push:
    branches: [main]
    paths:
      - 'crates/augmentagent-channel-core/**'
      - 'crates/augmentagent-approval-discord/**'
      - 'crates/augmentagent-cli/**'
      - 'scripts/runpod-adapter/**'
      - 'scripts/reasoner-fault-injection/**'
      - 'src/modelRouter*'
      - 'src/dashboard.ts'
      - 'views/model-*'
      - 'test/modelRouter*'
      - 'scripts/*model-router*'
      - 'scripts/*runpod-adapter*'
      - 'scripts/lib/install-launchd-plist.sh'
      - 'scripts/macos_parity_inventory.py'
      - 'docs/macos-parity-inventory.json'
      - 'scripts/tests/model_router*'
      - 'scripts/tests/runpod_adapter_install_test.py'
      - 'scripts/tests/run_model_router_image_fixture.py'
      - 'scripts/tests/verify_codex_redirect.py'
      - 'scripts/tests/test_verify_codex_redirect.py'
      - 'sidecars/9router/**'
      - '.github/workflows/model-router.yml'
      - "scripts/ci-contract.py"
      - "scripts/ci-contract.json"
      - "scripts/ci-contract-sync.py"
      - "scripts/tests/ci_contract_test.py"
permissions:
  contents: read
# Superseded PR heads cancel; non-PR runs retain distinct queue slots.
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id model-router/installer/1"

      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id model-router/installer/2"

        if: runner.os == 'macOS'
      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id model-router/installer/3"

      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id model-router/installer/4"

      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id model-router/installer/5"

      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id model-router/installer/6"

      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id model-router/installer/7"

      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id model-router/installer/8"

      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id model-router/installer/9"

      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id model-router/installer/10"

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id model-router/dashboard/2"

      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id model-router/dashboard/3"

      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id model-router/dashboard/4"

      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id model-router/dashboard/5"

      - run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id model-router/dashboard/6"


  pinned-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build pinned 9Router with the reconciliation patch
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id model-router/pinned-gateway/1"

      - name: Exercise account failover, request identity and media refusal
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id model-router/pinned-gateway/2"

  codex-redirect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install pinned Codex client
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id model-router/codex-redirect/2"

      - name: Prove the gate detects credential forwarding
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id model-router/codex-redirect/3"

      - name: Refuse router credential on a cross-origin redirect
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id model-router/codex-redirect/4"

  adapter-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Exercise private adapter deployment with paused synthetic routes
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id model-router/adapter-compose/1"
