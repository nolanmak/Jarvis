name: Finance integration
on:
  pull_request:
    paths:
      - 'crates/augmentagent-finance/**'
      - 'crates/augmentagent-cli/**'
      - 'crates/augmentagent-store/**'
      - 'crates/augmentagent-wiki/**'
      - 'crates/augmentagent-channel-core/src/reasoner.rs'
      - 'scripts/systemd/augmentagent-finance-sync.*'
      - '.github/workflows/finance.yml'
      - 'Cargo.*'
permissions:
  contents: read
jobs:
  finance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Format finance crate
        run: cargo fmt -p augmentagent-finance -- --check
      - name: Finance lint
        run: cargo clippy -p augmentagent-finance --all-targets -- -D warnings
      - name: Finance and wiki behavior
        run: cargo test -p augmentagent-finance -p augmentagent-wiki
      - name: Store and agent integration
        run: |
          cargo test -p augmentagent-store --lib finance_evidence
          cargo test -p augmentagent-channel-core --lib finance_allowlist
      - name: CLI unit and process tests
        run: |
          cargo test -p augmentagent-cli --bin augmentagent finance::tests
          cargo test -p augmentagent-cli --test finance_cli
          cargo test -p augmentagent-cli --test status_schema
