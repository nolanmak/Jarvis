name: Finance integration
on:
  pull_request:
    paths:
      - 'crates/augmentagent-finance/**'
      - 'crates/augmentagent-cli/**'
      - 'crates/augmentagent-store/**'
      - 'crates/augmentagent-wiki/**'
      - 'crates/augmentagent-channel-core/src/reasoner.rs'
      - 'scripts/systemd/augmentagent-finance-sync.*'
      - '.github/workflows/finance.yml'
      - 'Cargo.*'
      - "scripts/ci-contract.py"
      - "scripts/ci-contract.json"
      - "scripts/ci-contract-sync.py"
      - "scripts/tests/ci_contract_test.py"
permissions:
  contents: read
# Superseded PR heads cancel; non-PR runs retain distinct queue slots.
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
  finance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      # Restore-only: rust-cache.yml writes this cache from main. Build
      # parallelism doesn't change artifacts, so it stays out of the cache key.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ci
          env-vars: ImageOS
          save-if: false
        env:
          CARGO_BUILD_JOBS: ''
      - name: Format finance crate
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id finance/finance/3"

      - name: Finance lint
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id finance/finance/4"

      - name: Finance and wiki behavior
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id finance/finance/5"

      - name: Store and agent integration
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id finance/finance/6"
      - name: CLI unit and process tests
        run: "python3 \"${{ github.workspace }}/scripts/ci-contract.py\" step --hosted --id finance/finance/7"
