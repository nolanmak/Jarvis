[package]
name = "augmentagent-approval-discord"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
augmentagent-store = { path = "../augmentagent-store" }
# #176 — `!loops` Discord command reuses the shared /proc walker + signal
# primitive that backs `augmentagent loops` (#175).
augmentagent-loops = { path = "../augmentagent-loops" }
# #939 — shared PDF/DOCX → text pipeline (pdftotext, then Mistral OCR for
# scanned PDFs) so Discord drops and the CLI extract identically.
augmentagent-docs = { path = "../augmentagent-docs" }

tokio = { workspace = true }
tokio-util = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
# #231 — cron-style /loop scheduling (timezone-aware via IANA db).
cron = { workspace = true }
chrono-tz = { workspace = true }
# #1291 — the host zone's IANA *name* (CoreFoundation on macOS, /etc/localtime
# on Linux); its rules come from chrono-tz, never from host zoneinfo files.
iana-time-zone = "0.1"
thiserror = { workspace = true }
tracing = { workspace = true }
dashmap = { workspace = true }
serenity = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
tokio-tungstenite = "0.21"
libc = "0.2"
uuid = { workspace = true }
tempfile = "3"

[dev-dependencies]
mockito = "1"
