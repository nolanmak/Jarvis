[package]
name = "augmentagent-approval-discord"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
augmentagent-store = { path = "../augmentagent-store" }
# #176 — `!loops` Discord command reuses the shared /proc walker + signal
# primitive that backs `augmentagent loops` (#175).
augmentagent-loops = { path = "../augmentagent-loops" }
# #939 — shared PDF/DOCX → text pipeline (pdftotext, then Mistral OCR for
# scanned PDFs) so Discord drops and the CLI extract identically.
augmentagent-docs = { path = "../augmentagent-docs" }

tokio = { workspace = true }
tokio-util = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
# #231 — cron-style /loop scheduling (timezone-aware via IANA db).
cron = { workspace = true }
chrono-tz = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
dashmap = { workspace = true }
serenity = { workspace = true }
serde = { workspace = true }
reqwest = { workspace = true }
libc = "0.2"

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3"
