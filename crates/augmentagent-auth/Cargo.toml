[package]
name = "augmentagent-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# macOS Keychain via the `apple-native` backend. `crypto-rust` keeps the
# transitive dep tree pure-Rust and avoids pulling OpenSSL.
keyring = { version = "3", features = ["apple-native", "crypto-rust"] }
thiserror = { workspace = true }
tracing = { workspace = true }
