[package]
name = "augmentagent-mcp-memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# MCP (Model Context Protocol) server for cross-session FTS5-backed memory.
# Spawned by Claude Code via the `mcp.json` config (see
# `augmentagent-channel-core::mcp` / issue #110). Talks JSON-RPC over stdio;
# wraps the existing `augmentagent-store` sqlite db so the same memory rows
# are visible to the agent and to ad-hoc CLI tools.

[lib]
name = "augmentagent_mcp_memory"
path = "src/lib.rs"

[[bin]]
name = "augmentagent-mcp-memory"
path = "src/main.rs"

[dependencies]
augmentagent-store = { path = "../augmentagent-store" }

anyhow = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"
