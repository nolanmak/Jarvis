[package]
name = "augmentagent-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "augmentagent"
path = "src/main.rs"

[dependencies]
augmentagent-store = { path = "../augmentagent-store" }
augmentagent-channel-core = { path = "../augmentagent-channel-core" }
augmentagent-channel-reddit = { path = "../augmentagent-channel-reddit" }
augmentagent-channel-email = { path = "../augmentagent-channel-email" }
augmentagent-channel-linkedin = { path = "../augmentagent-channel-linkedin" }
augmentagent-channel-twitter = { path = "../augmentagent-channel-twitter" }
# #240 — SocialAPI.ai outbound publisher arm in MultiPlatformPublisher.
augmentagent-channel-socialapi = { path = "../augmentagent-channel-socialapi" }
augmentagent-channel-discord-dm = { path = "../augmentagent-channel-discord-dm" }
augmentagent-channel-slack = { path = "../augmentagent-channel-slack" }
augmentagent-channel-github = { path = "../augmentagent-channel-github" }
augmentagent-channel-meetup = { path = "../augmentagent-channel-meetup" }
augmentagent-channel-gdrive = { path = "../augmentagent-channel-gdrive" }
augmentagent-channel-contacts = { path = "../augmentagent-channel-contacts" }
# Spike scaffold (#116). Linked so it builds with the workspace; INERT in
# prod — no `serve` spawn until AUGMENTAGENT_DEFT_ENABLED + a persisted token
# AND the docs/deft-protocol.md live-validation TODOs clear (mirrors the
# github "gates on a PAT ⇒ never spawned" pattern).
augmentagent-channel-deft = { path = "../augmentagent-channel-deft" }
augmentagent-channel-telegram-bot = { path = "../augmentagent-channel-telegram-bot" }
augmentagent-channel-calendar = { path = "../augmentagent-channel-calendar" }
augmentagent-approval-discord = { path = "../augmentagent-approval-discord" }
augmentagent-auth = { path = "../augmentagent-auth" }
augmentagent-wiki = { path = "../augmentagent-wiki" }
augmentagent-browser-client = { path = "../augmentagent-browser-client" }
augmentagent-renderer-client = { path = "../augmentagent-renderer-client" }
augmentagent-proactive = { path = "../augmentagent-proactive" }
augmentagent-channel-voice = { path = "../augmentagent-channel-voice" }
augmentagent-content-adapter = { path = "../augmentagent-content-adapter" }
# #176 — shared /proc walker + signal primitive consumed by both `loops`
# and the Discord `!loops` command (avoids a circular dep through the cli bin).
augmentagent-loops = { path = "../augmentagent-loops" }

async-trait = { workspace = true }
serenity = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = { workspace = true }
chrono = { workspace = true }
# #231 — `loop create --cron --tz` validates cron exprs + IANA tz at
# create-time before persisting; fails fast with clear error.
cron = { workspace = true }
chrono-tz = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
# #1 — `status` subcommand probes the dashboard's `/api/v1/stats` for proof
# of life. Workspace `reqwest` is `default-features = false` + `rustls-tls`,
# so this pulls in no openssl. The dep is re-asserted here (rather than
# inherited transitively) so the binary keeps building even if a sibling
# crate drops its reqwest dep in the future.
reqwest = { workspace = true }
serde = { workspace = true }

# #175/#176 — clap layer + test helpers still need libc constants for the
# fake `Signaler` that returns ESRCH; the real walker + kill live in the
# `augmentagent-loops` shared crate so the Discord channel can call them.
libc = "0.2"

# #14 — snapshot test for the `augmentagent status --json` schema. `insta`
# is the idiomatic Rust snapshot crate; `tempfile` gives the test an isolated
# sqlite db path so probe output is deterministic on a fresh box.
[dev-dependencies]
insta = { version = "1", features = ["json", "redactions"] }
tempfile = "3"
# Used by the snapshot test to pre-seed the legacy schema tables (`actions`,
# `emails`, `gmail_accounts`) that `Store::migrate` assumes already exist —
# `augmentagent-store::Store::open` panics on a fresh empty db otherwise.
rusqlite = { workspace = true }
# #160 — `deft login` tests stub the Deftform `whoami()` HTTP probe so the
# CLI's reject-on-bad-token path is exercised without a real workspace.
mockito = "1"
